<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- 外部スクリプトの読み込みと外部への通信を禁止（万一の混入時の被害を抑える） -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>cinema-jump</title>
<style>
  /* 速度優先の道具なので、外部フォント・画像・ライブラリは一切使わない。
     影やぼかしも最小限（販売開始の瞬間に描画で待たされたら本末転倒） */
  :root {
    color-scheme: dark;
    --bg: #0d0f12;
    --surface: #16191e;
    --surface2: #1b1f26;
    --line: #262b33;
    --text: #e8eaed;
    --muted: #8a919c;
    --accent: #e8b44a;      /* 場内の照明みたいな琥珀色 */
    --go: #1fae6a;          /* 買える */
    --warn: #e8913a;        /* 会員先行・残りわずか */
    --info: #5aa9e6;        /* まだ売っていない */
    --bad: #e05a5a;         /* 満席 */
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif; margin: 0;
    padding: 0 14px 28px; background: var(--bg); color: var(--text);
    line-height: 1.6; max-width: 720px; margin-inline: auto;
  }

  /* ヘッダー：フィルムの帯をグラデーションで描く（画像なし） */
  header { padding: 16px 0 12px; }
  h1 {
    font-size: 17px; margin: 0; letter-spacing: .08em; font-weight: 700;
    display: flex; align-items: center; gap: 9px;
  }
  h1::before {
    content: ''; width: 5px; height: 19px; border-radius: 2px;
    background: repeating-linear-gradient(180deg, var(--accent) 0 4px, transparent 4px 7px);
  }
  .sub { color: var(--muted); font-size: 12px; margin: 3px 0 0 14px; }

  /* 劇場・日付は上に貼り付けておく（スクロールしても切り替えられる） */
  #picker {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    padding: 8px 0 10px; border-bottom: 1px solid var(--line);
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  select, input {
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 11px; font-size: 16px; font-family: inherit; width: 100%;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }
  .narrow { flex: 0 0 42%; }
  #theater { font-weight: 600; }

  .sale {
    background: linear-gradient(180deg, #1a1b16, var(--surface));
    border: 1px solid #3a3524; border-left: 3px solid var(--accent);
    border-radius: 9px; padding: 10px 12px; font-size: 13px; margin: 14px 0 12px;
  }
  .sale b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .sale .note { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .head {
    font-size: 15px; font-weight: 700; margin: 16px 0 10px;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .head .count { color: var(--muted); font-size: 12px; font-weight: 400; }

  .item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; margin-bottom: 8px; cursor: pointer;
  }
  .item:active { background: var(--surface2); }
  /* 作品一覧の行は左端に細い印を付けて、押せることを示す */
  #list > .item { border-left: 3px solid #2f3540; }
  #list > .item:active { border-left-color: var(--accent); }

  .scr { display: flex; align-items: center; gap: 11px; }
  .scr .t {
    font-size: 21px; font-weight: 700; min-width: 66px;
    font-variant-numeric: tabular-nums; letter-spacing: .01em;
  }
  .scr .meta { color: var(--muted); font-size: 12px; flex: 1; }
  .seat { font-weight: 700; margin-left: 3px; }
  .seat.ok { color: var(--go); }
  .seat.few { color: var(--warn); }
  .seat.full { color: var(--bad); }

  .badge {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    font-weight: 700; border: 1px solid transparent;
  }
  .onsale { background: rgba(31,174,106,.16); color: #4fd894; border-color: rgba(31,174,106,.45); }
  .presale { background: rgba(232,145,58,.16); color: #f0a95f; border-color: rgba(232,145,58,.45); }
  .before { background: rgba(90,169,230,.14); color: #8fc6f0; border-color: rgba(90,169,230,.4); }
  .closed { background: #1f242b; color: var(--muted); border-color: #2b313a; }

  .btns { display: flex; gap: 7px; margin-top: 10px; }
  .btn {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 8px; font-size: 13px;
    text-decoration: none; border: 1px solid var(--line); background: var(--surface2);
    color: #c8ccd3; cursor: pointer; font-family: inherit;
  }
  .btn:active { background: #232833; }
  .btn.go {
    background: var(--go); border-color: var(--go); color: #04170d; font-weight: 700;
    flex: 1.4;
  }
  .btn.go:active { background: #1a9a5c; }
  .btn:disabled { opacity: .45; cursor: default; }

  .back {
    color: var(--accent); cursor: pointer; font-size: 13px;
    display: inline-block; margin: 14px 0 4px;
  }
  .msg { color: var(--muted); padding: 18px 2px; font-size: 14px; }
  .err { color: #f08a8a; }
  .when { color: #8fc6f0; font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 11px; margin: 12px 2px; line-height: 1.5; }
</style>

<header>
  <h1>cinema-jump</h1>
  <div class="sub">映画館の座席選択ページへ直行する</div>
</header>

<div id="picker">
  <div class="row">
    <select id="chain" class="narrow"><option>読み込み中…</option></select>
    <select id="theater"><option>…</option></select>
  </div>
  <div class="row">
    <input type="search" id="thfilter" placeholder="劇場を地名で検索（例: 横浜）">
  </div>
  <div class="row">
    <input type="date" id="date" class="narrow">
    <input type="search" id="filter" placeholder="作品名で絞り込み（任意）">
  </div>
</div>

<div id="sale"></div>
<div id="list"><div class="msg">読み込み中…</div></div>

<script>
const $ = (id) => document.getElementById(id);
// 映画館サイト由来の文字列（作品名・劇場名・スクリーン名）をそのままHTMLに差し込まない。
// 向こうのデータに <script> が混ざったらこちらのページで動いてしまうため
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = {
  theaters: [],
  theater: localStorage.getItem('cj.theater') || 'urasoe',
  chain: localStorage.getItem('cj.chain') || '',
  date: null, films: [], film: null,
};

// toISOString() は UTC なので、日本時間0:00〜9:00に前日が出てしまう。端末のローカル日付で組む
const fmtDate = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const WD = ['日','月','火','水','木','金','土'];
const LABEL = { onsale: '販売中', presale: '会員先行', before: '販売前', closed: '対象外' };
const SEAT_CLASS = { '○': 'ok', '△': 'few', '×': 'full' };

const PREFIX_CHAIN = { 'st-': 'star', 'cs-': 'sunshine', 'ae-': 'aeon', 'smt-': 'smt', 'c109-': 'c109', 'tj-': 'tjoy', 'toho-': 'toho' };
const chainOf = () => (S.theaters.find((t) => t.slug === S.theater) || {}).chain
  || Object.entries(PREFIX_CHAIN).find(([p]) => S.theater.startsWith(p))?.[1] || 'united';

// 販売開始の目安。実際の日時は各上映回のデータから出すので、ここは「見当をつける」用
//   ユナイテッド・シネマ：会員（CLUB-SPICE）が上映日の3日前 21:00 ※実測からの推定
//   スターシアターズ／シネマサンシャイン：上映日の2日前 0:00 ※公式の規約・FAQに明記
//   イオンシネマ：公式ルール未確認。各回のデータに任せる
function saleStart(dateStr, daysBefore, time) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - daysBefore);
  return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]}) ${time}`;
}

function saleBanner() {
  const chain = chainOf();
  if (chain === 'united') {
    return `<div class="sale">
      会員販売開始（推定）: <b>${saleStart(S.date, 3, '21:00')}</b>
      <div class="note">※ 上映日3日前の21:00。実測からの推定で公式確認は未取得</div></div>`;
  }
  // 上映日2日前0:00から一般発売、というチェーン。会員先行の有無だけが違う
  const TWO_DAYS = {
    star: '通常作品に会員先行はない',
    sunshine: '会員先行は3日前20:30（PLATINUM）／21:00（BRONZE・GOLD）',
    c109: 'シネマポイント会員は3日前21:00から',
    toho: 'TOHO-ONE会員は3日前21:00から（ログインが要る）',
  };
  if (TWO_DAYS[chain]) {
    const detail = chain === 'star' || chain === 'sunshine'
      ? '各回の実際の開始日時は上映回一覧に出る'
      : 'このチェーンは回ごとの販売開始日時がデータに出ないので、この目安で判断しろ';
    return `<div class="sale">
      オンライン購入開始: <b>${saleStart(S.date, 2, '0:00')}</b>
      <div class="note">※ 公式規約・FAQで「鑑賞日2日前0:00から」。${TWO_DAYS[chain]}。一部作品は例外あり。${detail}</div></div>`;
  }
  if (chain === 'aeon') {
    return `<div class="sale">
      オンライン購入開始: <b>各上映回の表示を見ろ</b>
      <div class="note">※ 実測では上映日2日前0:00（会員はその前日18:00）。公式ルールは未確認なので、各回の実データを出している</div></div>`;
  }
  if (chain === 'tjoy') {
    return `<div class="sale">
      掲載＝販売開始: <b>当日＋2日先まで</b>
      <div class="note">※ T・ジョイはスケジュールが出た時点で買える。先の日付はまだ出ない</div></div>`;
  }
  return `<div class="sale">
      購入開始: <b>各上映回の表示を見ろ</b>
      <div class="note">※ このチェーンは公式の販売開始ルールが未確認</div></div>`;
}

async function api(params) {
  const q = new URLSearchParams({ ...params, json: '1' });
  const r = await fetch('/api/go?' + q);
  const j = await r.json().catch(() => ({ error: 'レスポンスが読めなかった' }));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

async function loadTheaters() {
  try {
    const { theaters } = await (await fetch('/api/theaters')).json();
    S.theaters = theaters.filter((t) => !t.comingSoon);
  } catch {
    S.theaters = [
      { slug: 'urasoe', name: 'PARCO CITY 浦添', chain: 'united', chainLabel: 'ユナイテッド・シネマ' },
      { slug: 'st-cinemaq', name: 'シネマQ', chain: 'star', chainLabel: 'スターシアターズ（沖縄）' },
    ];
  }
  // いま選んでいる劇場の系列を初期値にする
  const current = S.theaters.find((t) => t.slug === S.theater);
  if (!S.chain) S.chain = current ? current.chain : 'all';
  renderChains();
  renderTheaters();
}

// 選択中の劇場の系列に、左のプルダウンの表示を合わせる
function syncChain() {
  const t = S.theaters.find((x) => x.slug === S.theater);
  if (!t || S.chain === 'all' || t.chain === S.chain) return;
  S.chain = t.chain;
  localStorage.setItem('cj.chain', S.chain);
  renderChains();
}

function chainList() {
  const seen = new Map();
  for (const t of S.theaters) if (!seen.has(t.chain)) seen.set(t.chain, t.chainLabel || t.chain);
  return [...seen];
}

function renderChains() {
  const counts = {};
  for (const t of S.theaters) counts[t.chain] = (counts[t.chain] || 0) + 1;
  $('chain').innerHTML =
    `<option value="all"${S.chain === 'all' ? ' selected' : ''}>すべて（${S.theaters.length}）</option>`
    + chainList().map(([id, label]) =>
      `<option value="${id}"${id === S.chain ? ' selected' : ''}>${label}（${counts[id]}）</option>`).join('');
}

// 劇場の選択肢：キーワードがあれば系列をまたいで探す（地名で引けるように）
function renderTheaters() {
  const kw = $('thfilter').value.trim();
  const hit = (t) => !kw || t.name.includes(kw) || (t.chainLabel || '').includes(kw);
  const list = S.theaters.filter((t) => hit(t) && (kw || S.chain === 'all' || t.chain === S.chain));

  if (!list.length) {
    $('theater').innerHTML = '<option value="">該当する劇場なし</option>';
    return;
  }
  const opt = (t) =>
    `<option value="${esc(t.slug)}"${t.slug === S.theater ? ' selected' : ''}>${esc(t.name)}</option>`;
  // 系列をまたぐときだけ、どの系列かが分かるようにまとめる
  const grouped = kw || S.chain === 'all';
  $('theater').innerHTML = grouped
    ? chainList().map(([id, label]) => {
      const inChain = list.filter((t) => t.chain === id);
      return inChain.length ? `<optgroup label="${esc(label)}">${inChain.map(opt).join('')}</optgroup>` : '';
    }).join('')
    : list.map(opt).join('');

  // 選択中の劇場が候補から消えていたら先頭に切り替える
  if (!list.some((t) => t.slug === S.theater)) {
    S.theater = list[0].slug;
    $('theater').value = S.theater;
    localStorage.setItem('cj.theater', S.theater);
    syncChain();       // 系列の表示が劇場とずれないように合わせる
    return true;       // 劇場が変わった
  }
  $('theater').value = S.theater;
  return false;
}

async function loadFilms() {
  S.film = null;
  $('sale').innerHTML = saleBanner();
  $('list').innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const j = await api({ th: S.theater, d: S.date });
    S.films = j.films;
    renderFilms();
  } catch (e) {
    S.films = [];
    $('list').innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
}

function renderFilms() {
  const kw = $('filter').value.trim();
  const list = kw ? S.films.filter((f) => f.name.includes(kw)) : S.films;
  $('picker').style.display = '';
  if (!list.length) return ($('list').innerHTML = '<div class="msg">該当作品なし</div>');
  $('list').innerHTML =
    `<div class="head">上映作品<span class="count">${list.length}件</span></div>` +
    list.map((f) => `<div class="item" data-film="${esc(f.film)}">${esc(f.name)}</div>`).join('');
  document.querySelectorAll('[data-film]').forEach((el) =>
    el.onclick = () => loadScreenings(el.dataset.film));
}

async function loadScreenings(film) {
  $('picker').style.display = 'none';
  $('list').innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const j = await api({ th: S.theater, d: S.date, f: film });
    S.film = j;
    $('list').innerHTML =
      `<div class="back" id="back">← 作品一覧へ戻る</div>
       <div class="head">${esc(j.name)}<span class="count">${esc(S.date)}</span></div>` +
      (j.screenings.length ? j.screenings.map((s) => `
        <div class="item" style="cursor:default">
          <div class="scr">
            <div class="t">${esc(s.time)}</div>
            <div class="meta">～${esc(s.end)} ／ SCR ${esc(s.screen)}</div>
            <span class="badge ${s.status}">${LABEL[s.status] || '-'}</span>
            ${s.seat ? `<span class="seat ${SEAT_CLASS[s.seat] || ''}">${esc(s.seat)}</span>` : ''}
          </div>
          ${!s.onSale && s.status === 'before' && s.saleStart
            ? `<div class="when">購入開始 ${esc(s.saleStart)}${s.memberSaleStart ? `（会員 ${esc(s.memberSaleStart)}）` : ''}</div>` : ''}
          ${s.platinumFrom ? `<div class="when">PLATINUM会員先行 ${esc(s.platinumFrom)}〜${s.platinumLimit ? `（${esc(s.platinumLimit)}枚まで）` : ''}</div>` : ''}
          ${s.windowOnly ? '<div class="when">窓口販売のみ</div>' : ''}
          <div class="btns">
            ${s.onSale
              ? `<a class="btn go" href="${esc(s.bookmark)}">${s.status === 'presale' ? '会員先行購入へ' : '座席選択へ'}</a>`
              : `<button class="btn" disabled>${s.status === 'before' ? '販売開始前' : '販売対象外'}</button>`}
            <button class="btn copy" data-url="${esc(s.bookmark)}">URLをコピー</button>
            ${s.direct ? `<button class="btn copy" data-url="${esc(s.direct)}">直URLコピー</button>` : ''}
          </div>
        </div>`).join('') +
        (['star', 'sunshine', 'aeon', 'smt'].includes(chainOf()) ? `<div class="note">※ 直URLは購入画面そのもののURL。このツールを経由しないので、販売開始の瞬間に一番速い。
            販売前に開くと「販売期間外」と出るので、0:00を過ぎたら再読み込みしろ</div>` : '')
        + (chainOf() === 'toho' ? '<div class="note">※ TOHOは購入がPOST送信のため直URLを作れない。「座席選択へ」を押すと自動送信ページを経由し、TOHO側の「ログインせずに購入する」を1回押す必要がある</div>' : '')
        : '<div class="msg">上映回が取得できなかった</div>');
    $('back').onclick = renderFilms;
    document.querySelectorAll('.copy').forEach((b) => {
      const label = b.textContent;
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(b.dataset.url); b.textContent = 'コピーした ✓'; }
        catch { b.textContent = b.dataset.url; }
        setTimeout(() => { b.textContent = label; }, 1600);
      };
    });
  } catch (e) {
    $('list').innerHTML = `<div class="back" id="back">← 戻る</div><div class="msg err">${esc(e.message)}</div>`;
    $('back').onclick = renderFilms;
  }
}

// --- init ---
const today = new Date();
S.date = fmtDate(today);
$('date').value = S.date;

$('chain').onchange = (e) => {
  S.chain = e.target.value;
  localStorage.setItem('cj.chain', S.chain);
  if (renderTheaters()) loadFilms(); else loadFilms();
};
$('thfilter').oninput = () => { if (renderTheaters()) loadFilms(); };
$('theater').onchange = (e) => {
  if (!e.target.value) return;
  S.theater = e.target.value;
  localStorage.setItem('cj.theater', S.theater);
  syncChain();
  loadFilms();
};
$('date').onchange = (e) => { S.date = e.target.value; loadFilms(); };
$('filter').oninput = () => { if (!S.film) renderFilms(); };

loadTheaters().then(loadFilms);
</script>
</html>
